<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Sem conexão · Gestão Estética</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 30%, #1c1c1f 0%, #09090b 62%);
        color: #e4e4e7;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .icon {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      }
      h1 {
        margin: 22px 0 8px;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 26px;
        color: #a1a1aa;
        font-size: 0.95rem;
        line-height: 1.55;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 13px 22px;
        font: inherit;
        font-weight: 600;
        color: #09090b;
        background: linear-gradient(180deg, #dcb367, #d4a24e);
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
      .hint {
        margin-top: 18px;
        font-size: 0.78rem;
        color: #52525b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/icons/icon-192.png" alt="" width="84" height="84" />
      <h1>Você está sem conexão</h1>
      <p>
        O painel precisa de internet para carregar a agenda e as conversas.
        Verifique o Wi‑Fi ou os dados móveis e tente de novo.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
      <p class="hint">Se a internet está funcionando, aguarde alguns segundos e recarregue.</p>
    </main>
  </body>
</html>
